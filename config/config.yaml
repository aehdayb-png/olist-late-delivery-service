model:
  source: "mlflow"
  path: "models/final_model_logreg.pkl"
  version: "logreg_v1"
  registry_name: "OlistLateDelivery"
  registry_alias: "champion"
  fallback_to_local: false

transformers:
  imputer_path: "models/imputer.pkl"
  encoder_path: "models/encoder.pkl"
  scaler_path: "models/scaler.pkl"
  feature_list_path: "models/feature_list.txt"

api:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  log_file: "logs/service.log"

features:
  categorical_col: "customer_state"
  numeric_cols:
    - estimated_days
    - n_items
    - total_price
    - total_freight
    - n_distinct_products
    - n_distinct_sellers
    - total_payment
    - n_payment_entries
    - max_installments
  base_cols:
    - customer_state
    - purchase_month
    - purchase_weekday
    - purchase_hour
    - estimated_days
    - n_items
    - total_price
    - total_freight
    - n_distinct_products
    - n_distinct_sellers
    - total_payment
    - n_payment_entries
    - max_installments

validation:
  state_col: "customer_state"
  required_cols:
    - order_purchase_timestamp
    - order_estimated_delivery_date
    - customer_state
  allowed_states: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
  ranges:
    total_price: [0, 20000]
    total_freight: [0, 2000]
    n_items: [1, 50]
    n_distinct_products: [1, 50]
    n_distinct_sellers: [1, 20]
    total_payment: [0, 25000]
    n_payment_entries: [1, 50]
    max_installments: [1, 48]

monitoring:
  prediction_log: "logs/predictions.jsonl"

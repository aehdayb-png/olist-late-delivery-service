name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: python -m black --check app src tests scripts
      - name: Lint
        run: python -m flake8 app src tests scripts

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Pull model artifacts
        run: |
          dvc pull -r ci-remote
      - name: Register model
        run: python scripts/register_model.py
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DVC
        run: python -m pip install "dvc==3.58.0" "dvc-gdrive==3.0.1" "pathspec==0.12.1" "protobuf==5.29.6" "google-api-core==2.24.0" "cryptography==43.0.3" "pyOpenSSL==24.2.1"
      - name: Pull model artifacts
        run: |
          dvc pull -r ci-remote
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
